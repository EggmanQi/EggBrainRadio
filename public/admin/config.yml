# Decap CMS — private writing UI for EggBrain Radio
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: EggmanQi/EggBrainRadio
  branch: main
  # Must match the live site origin (workers.dev / pages.dev / custom domain)
  base_url: https://eggbrainradio.eggmanqi.workers.dev
  auth_endpoint: api/auth

# Local writing only: uncomment when running `npm run cms` with `npm run dev`.
# Keep this OFF in production — otherwise /admin can hang or render blank.
# local_backend: true

media_folder: public/uploads
public_folder: /uploads

# Solo author: publish commits straight to main (Cloudflare rebuilds automatically)
# Switch to editorial_workflow later if you want PR-based drafts.
publish_mode: simple

slug:
  encoding: ascii
  clean: true

collections:
  - name: words
    label: Words
    label_singular: Word
    folder: src/content/words
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: ['date', 'title']
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - {
          label: Date,
          name: date,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          format: YYYY-MM-DD,
        }
      - { label: Draft, name: draft, widget: boolean, default: true, required: false }
      - {
          label: Tags,
          name: tags,
          widget: list,
          allow_add: true,
          required: false,
          default: [],
        }
      - { label: Body, name: body, widget: markdown }

  - name: work
    label: Work
    label_singular: Project
    folder: src/content/work
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{status}}'
    sortable_fields: ['date', 'title']
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - {
          label: Date,
          name: date,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          format: YYYY-MM-DD,
        }
      - {
          label: Status,
          name: status,
          widget: select,
          options: ['shipped', 'building', 'archived'],
          default: 'building',
        }
      - {
          label: Tags,
          name: tags,
          widget: list,
          allow_add: true,
          required: false,
          default: [],
        }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - { label: Cover image path, name: cover, widget: string, required: false }
      - { label: App Store URL, name: storeUrl, widget: string, required: false }
      - { label: GitHub URL, name: githubUrl, widget: string, required: false }
      - { label: Website URL, name: websiteUrl, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
